name: parsedle

services:
  parsedle:
    build: .
    image: parsedle
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Warcraft Logs client credentials — https://www.warcraftlogs.com/api/clients/
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:-}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:-}
      # Only members of this guild are ever the answer.
      GUILD_NAME: ${GUILD_NAME:-LuckyDo}
      GUILD_SERVER: ${GUILD_SERVER:-}
      GUILD_REGION: ${GUILD_REGION:-}
      GUILD_ID: ${GUILD_ID:-}
      # Guards /api/reports and /api/roster. Unset means the admin API stays disabled.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      DATA_DIR: /data
    volumes:
      - parsedle-data:/data

volumes:
  parsedle-data:
