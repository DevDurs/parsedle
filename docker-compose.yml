name: parsedle

services:
  parsedle:
    build: .
    image: parsedle
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Warcraft Logs client credentials — https://www.warcraftlogs.com/api/clients/
      WCL_CLIENT_ID: ${WCL_CLIENT_ID:-}
      WCL_CLIENT_SECRET: ${WCL_CLIENT_SECRET:-}
      # Only members of this guild are ever the answer.
      GUILD_NAME: ${GUILD_NAME:-LuckyDo}
      GUILD_SERVER: ${GUILD_SERVER:-}
      GUILD_REGION: ${GUILD_REGION:-}
      GUILD_ID: ${GUILD_ID:-}
      # Guards /api/reports and /api/roster. Unset means the admin API stays disabled.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Discord. Login needs the client pair plus SESSION_SECRET; posting needs
      # the bot token plus a channel. Leave them empty and the game plays
      # anonymously and says nothing.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_REQUIRE_GUILD_MEMBER: ${DISCORD_REQUIRE_GUILD_MEMBER:-}
      DISCORD_DIGEST_HOUR: ${DISCORD_DIGEST_HOUR:-10}
      DISCORD_DIGEST_GRIDS: ${DISCORD_DIGEST_GRIDS:-}
      DISCORD_STREAK_MIN_PLAYERS: ${DISCORD_STREAK_MIN_PLAYERS:-1}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DATA_DIR: /data
    volumes:
      - parsedle-data:/data

volumes:
  parsedle-data:
